name: prune

# 每 7 天清理一次：北京时间每周一 03:17
# （cron 用 UTC，周日 19:17 UTC = 周一 03:17 北京时间）
on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 探测并剔除失效链接
        id: prune
        continue-on-error: true
        # 两类索引逐个跑：每一类各过各的安全阀，某类整体探测失败只会中止那一类。
        # --site . 会把同目录其余索引（含 .full 版）里的同一条死链一起摘掉。
        run: |
          for f in p.json r.json; do
            if [ ! -f "$f" ]; then continue; fi
            echo "::group::清理 $f"
            if python tools/prune.py --src "$f" --site . --apply --source action; then
              echo "$f 清理完成"
            else
              echo "::warning::$f 的清理被安全阀拦下或出错，已跳过（下次再试）"
            fi
            echo "::endgroup::"
          done

      - name: 有变化就提交
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "索引与删图记录都没有变化，跳过提交"
            exit 0
          fi
          rm -f *.bak
          git config user.name  "steambed-bot"
          git config user.email "steambed-bot@users.noreply.github.com"
          # 索引文件是动态的（p.json / r.json 及 .full 版），不逐个列举，直接全加。
          # 仓库里只有站点文件，*.bak 已被 .gitignore 挡住，不会误提交。
          git add -A
          n=$(python -c "import json;print(json.load(open('deleted_history.json')).get('count',0))" 2>/dev/null || echo "?")
          git commit -m "prune: 移除已失效的图片链接（删图记录累计 ${n} 条）"
          if ! git push origin HEAD; then
            echo "推送被拒（多半是本地刚手动推过），rebase 后重试"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin HEAD
          fi
