<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的 Steam 图床</title>
<style>
  :root{
    --bg:#0f1115; --panel:#151920; --card:#1a1f27; --line:#252b35;
    --fg:#e8ebef; --dim:#8b95a3; --accent:#4c8dff; --danger:#e5645e;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --card:#fff; --line:#e4e7ec;
           --fg:#1a1d21; --dim:#6b7480; --accent:#2563eb; color-scheme: light; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--panel);
         border-bottom:1px solid var(--line);padding:12px 20px}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.2px}
  .count{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  input[type=search],input[type=number]{
    background:var(--bg);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:6px 10px;font-size:13px;outline:none}
  input[type=search]{width:200px}
  input[type=search]:focus{border-color:var(--accent)}
  .btn{background:var(--bg);border:1px solid var(--line);color:var(--fg);
       border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;
       text-decoration:none;transition:border-color .15s,opacity .15s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.on{border-color:var(--accent);color:var(--accent)}
  .sub{color:var(--dim);font-size:12px;margin-top:6px}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
       gap:12px;padding:16px 20px 8px}
  .card{position:relative;margin:0;border-radius:10px;overflow:hidden;
        background:var(--card);border:1px solid var(--line);cursor:zoom-in;
        aspect-ratio:16/10}
  .card img{width:100%;height:100%;object-fit:cover;display:block;
            transition:transform .3s ease,opacity .3s;opacity:0}
  .card img.ready{opacity:1}
  .card:hover img{transform:scale(1.04)}
  .card .num{position:absolute;left:8px;bottom:8px;font-size:11px;color:#fff;
             background:rgba(0,0,0,.55);padding:1px 6px;border-radius:5px;
             opacity:0;transition:opacity .2s}
  .card:hover .num{opacity:1}
  .card .chk{position:absolute;left:8px;top:8px;width:18px;height:18px;
             accent-color:var(--accent);display:none;cursor:pointer}
  body.selmode .card .chk{display:block}
  .card.picked{outline:2px solid var(--accent);outline-offset:-2px}
  .card.broken{cursor:default}
  .card.broken img{opacity:0}
  .card.broken::after{content:"已失效";position:absolute;inset:0;display:grid;
    place-items:center;color:var(--danger);font-size:12px;background:var(--card)}
  .card.picked .chk{display:block}
  nav{display:flex;align-items:center;justify-content:center;gap:6px;
      padding:10px 20px 24px;flex-wrap:wrap}
  nav button{min-width:34px;height:32px;border-radius:8px;border:1px solid var(--line);
             background:var(--panel);color:var(--fg);cursor:pointer;font-size:13px}
  nav button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
  nav button[disabled]{opacity:.4;cursor:not-allowed}
  nav .gap{color:var(--dim);padding:0 2px}
  nav input[type=number]{width:64px;height:32px;text-align:center}
  footer{padding:0 20px 40px;color:var(--dim);font-size:12px;text-align:center}
  footer a{color:var(--accent)}
  .empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:60px 20px;
         font-size:13px;line-height:2}
  .empty code{background:var(--card);padding:2px 6px;border-radius:5px}
  #lb{position:fixed;inset:0;z-index:99;background:rgba(6,8,11,.95);
      display:none;align-items:center;justify-content:center}
  #lb.on{display:flex}
  #lbImg{max-width:calc(100% - 160px);max-height:calc(100% - 120px);
         object-fit:contain;border-radius:4px}
  #lb .arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;
             border:none;background:rgba(255,255,255,.07);color:#fff;font-size:26px;
             cursor:pointer;border-radius:10px;line-height:1}
  #lb .arrow:hover{background:rgba(255,255,255,.16)}
  #lbPrev{left:18px} #lbNext{right:18px}
  #lbClose{position:absolute;top:16px;right:18px;width:36px;height:36px;border:none;
           background:rgba(255,255,255,.08);color:#fff;font-size:20px;border-radius:8px;
           cursor:pointer;line-height:1}
  #lbBar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
         display:flex;align-items:center;gap:10px;background:rgba(20,24,30,.9);
         border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px}
  #lbInfo{color:#c9d2de;font-size:12px;min-width:90px}
  #lbBar .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
  #toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(8px);
         background:rgba(20,24,30,.95);color:#fff;border:1px solid rgba(255,255,255,.14);
         padding:8px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;
         transition:opacity .2s,transform .2s;z-index:120}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 分类标签栏：只有配置了 categories 才会出现 */
  #cats{display:none;gap:6px;flex-wrap:wrap;padding:8px 20px 10px;
        border-bottom:1px solid var(--line);background:var(--panel)}
  #cats.on{display:flex}
  #cats button{background:var(--bg);border:1px solid var(--line);color:var(--fg);
               border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;
               line-height:1.5;font-family:inherit}
  #cats button:hover{border-color:var(--accent)}
  #cats button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #cats button .n{opacity:.65;margin-left:5px;font-size:11px}
  @media (max-width:640px){
    main{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:12px}
    input[type=search]{width:120px}
    #lbImg{max-width:100%;max-height:calc(100% - 130px)}
    #cats{padding:8px 12px 10px}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>我的 Steam 图床</h1>
    <span class="count" id="count"> — </span>
    <span class="spacer"></span>
    <input type="search" id="q" placeholder="搜索编号或路径" autocomplete="off">
    <button class="btn" id="selBtn" type="button">选择</button>
    <button class="btn primary" id="dlBtn" type="button" disabled>下载所选</button>
  </div>
  <div class="sub" id="sub"></div>
</header>

<nav id="cats"></nav>

<main id="grid"></main>
<nav id="pager"></nav>
<footer>图片托管于 Steam 图片 CDN（images.steamusercontent.com）　索引：<a href="p.json">p.json</a> / <a href="r.json">r.json</a></footer>

<div id="lb">
  <button class="arrow" id="lbPrev" type="button">‹</button>
  <img id="lbImg" alt="">
  <button class="arrow" id="lbNext" type="button">›</button>
  <button id="lbClose" type="button">×</button>
  <div id="lbBar">
    <span id="lbInfo"></span>
    <button class="btn" id="lbCopy" type="button">复制直链</button>
    <a class="btn" id="lbOpen" target="_blank" rel="noopener">新窗口</a>
  </div>
</div>
<div id="toast"></div>

<script>
const CDN = "https://images.steamusercontent.com/ugc/";
const PER = 60;
const THUMB = "?imw=520&imh=520&impolicy=Letterbox";

let PICS = [], view = [], page = 1, sel = new Set(), selMode = false, lbIdx = -1;
let CATS = [], DATA = {}, curCat = "";
// 类目清单由 export 直接写进页面：线上不再需要多请求一个 categories.json，
// 少一个文件就少一处"改了索引忘了改类目"的错位。
const CATS_CFG = [{"slug":"p","name":"普通","index":"p.json","count":6},{"slug":"r","name":"R 级","index":"r.json","count":0}];

const $ = s => document.querySelector(s);
const grid = $("#grid"), pager = $("#pager");

function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 1800);
}

function setCats(list){
  CATS = (list || []).filter(c => c && c.slug && c.index);
  const nav = $("#cats");
  nav.innerHTML = "";
  if (!CATS.length){ nav.classList.remove("on"); return; }
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.slug = c.slug;
    b.appendChild(document.createTextNode(c.name || c.slug));
    if (typeof c.count === "number"){
      const n = document.createElement("span");
      n.className = "n"; n.textContent = c.count;
      b.appendChild(n);
    }
    b.addEventListener("click", () => pickCat(c.slug));
    nav.appendChild(b);
  });
  nav.classList.add("on");
}

function boot(pics){
  PICS = (pics || []).filter(Boolean);
  $("#count").textContent = "共 " + PICS.length + " 张";
  // 换类目后旧的勾选跨类残留会很危险（下载到的可能是别的类里的同名序号），一律清空
  sel.clear(); updateSel();
  document.querySelectorAll(".card").forEach(c => c.classList.remove("picked"));
  apply();
}

function pickCat(slug){
  const c = CATS.find(x => x.slug === slug) || CATS[0];
  if (!c) return;
  curCat = c.slug;
  document.querySelectorAll("#cats button").forEach(b =>
    b.classList.toggle("on", b.dataset.slug === c.slug));
  if (DATA[c.index]){ boot(DATA[c.index]); return; }   // 本地内联模式
  grid.innerHTML = '<p class="empty">载入中…</p>';
  fetch(c.index, { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(c.index + " HTTP " + r.status); return r.json(); })
    .then(d => boot(Array.isArray(d) ? d : d.pics))
    .catch(e => {
      grid.innerHTML = '<p class="empty">读取 ' + c.index + ' 失败：' + e.message + '</p>';
    });
}

// 线上：类目已经在页面里，按类目拉对应的索引文件即可。
// 没有类目信息时退化成只读 r.json，行为跟老版本一致。
function load(){
  if (CATS_CFG && CATS_CFG.length){
    setCats(CATS_CFG);
    pickCat(CATS_CFG[0].slug);
    return;
  }
  setCats([]);
  fetch("r.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(d => boot(Array.isArray(d) ? d : d.pics))
    .catch(e => {
      grid.innerHTML = '<p class="empty">读取索引失败：' + e.message +
        '<br>若是 file:// 直接双击打开的，请改用 gallery.html 或本地服务器。</p>';
    });
}

// 本地：所有索引内容都内联在 DATA 里，双击就能开，不需要服务器
function bootInline(data){
  DATA = data || {};
  if (CATS_CFG && CATS_CFG.length){
    setCats(CATS_CFG);
    pickCat(CATS_CFG[0].slug);
  } else {
    setCats([]);
    boot(DATA["r.json"] || []);
  }
}

function apply(){
  const q = $("#q").value.trim().toLowerCase();
  view = q
    ? PICS.filter((p, i) => p.toLowerCase().includes(q) ||
        ("#" + String(i + 1).padStart(3, "0")).includes(q))
    : PICS.slice();
  page = 1; render();
}

function makeCard(p, idx){
  const card = document.createElement("figure");
  card.className = "card";
  card.dataset.path = p;
  if (sel.has(p)) card.classList.add("picked");

  const img = document.createElement("img");
  img.loading = "lazy"; img.decoding = "async"; img.alt = "#" + (idx + 1);
  img.src = CDN + p + THUMB;
  img.onload = () => img.classList.add("ready");
  img.onerror = () => card.classList.add("broken");

  const num = document.createElement("span");
  num.className = "num"; num.textContent = "#" + String(idx + 1).padStart(3, "0");

  const chk = document.createElement("input");
  chk.type = "checkbox"; chk.className = "chk"; chk.checked = sel.has(p);
  chk.addEventListener("click", ev => { ev.stopPropagation(); toggle(p); });

  card.append(img, num, chk);
  card.addEventListener("click", () => {
    if (selMode) { toggle(p); } else { openLb(idx); }
  });
  return card;
}

function render(){
  const pages = Math.max(1, Math.ceil(view.length / PER));
  page = Math.min(Math.max(1, page), pages);
  const start = (page - 1) * PER;
  const slice = view.slice(start, start + PER);

  grid.innerHTML = "";
  if (!slice.length){
    grid.innerHTML = '<p class="empty">还没有图片。<br>上传新图后运行一次 ' +
      '<code>sync</code>，索引和这里都会自动更新。</p>';
  } else {
    const frag = document.createDocumentFragment();
    slice.forEach((p, k) => frag.appendChild(makeCard(p, start + k)));
    grid.appendChild(frag);
  }

  $("#sub").textContent = view.length === PICS.length
    ? "第 " + page + " / " + pages + " 页　每页 " + PER + " 张"
    : "筛选出 " + view.length + " 张　第 " + page + " / " + pages + " 页";

  renderPager(pages);
  updateSel();
}

function renderPager(pages){
  pager.innerHTML = "";
  if (pages <= 1) return;
  const btn = (label, target, opts) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    if (opts && opts.cur) b.className = "cur";
    if (opts && opts.dis) b.disabled = true;
    else b.addEventListener("click", () => { page = target; render();
      window.scrollTo({ top: 0, behavior: "smooth" }); });
    pager.appendChild(b);
  };
  btn("‹", page - 1, { dis: page === 1 });
  const nums = new Set([1, pages, page, page - 1, page + 1]);
  const list = [...nums].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
  let prev = 0;
  list.forEach(n => {
    if (n - prev > 1){
      const gap = document.createElement("span");
      gap.className = "gap"; gap.textContent = "…";
      pager.appendChild(gap);
    }
    btn(String(n), n, { cur: n === page });
    prev = n;
  });
  btn("›", page + 1, { dis: page === pages });

  const jump = document.createElement("input");
  jump.type = "number"; jump.min = 1; jump.max = pages; jump.placeholder = "跳页";
  jump.addEventListener("change", () => {
    const v = parseInt(jump.value, 10);
    if (v >= 1 && v <= pages){ page = v; render(); window.scrollTo({ top: 0 }); }
    jump.value = "";
  });
  pager.appendChild(jump);
}

function toggle(p){
  sel.has(p) ? sel.delete(p) : sel.add(p);
  document.querySelectorAll(".card").forEach(c => {
    if (c.dataset.path === p){
      c.classList.toggle("picked", sel.has(p));
      const b = c.querySelector(".chk");
      if (b) b.checked = sel.has(p);
    }
  });
  updateSel();
}

function updateSel(){
  const b = $("#dlBtn");
  b.textContent = sel.size ? "下载所选（" + sel.size + "）" : "下载所选";
  b.disabled = sel.size === 0;
}

$("#selBtn").addEventListener("click", () => {
  selMode = !selMode;
  document.body.classList.toggle("selmode", selMode);
  $("#selBtn").classList.toggle("on", selMode);
  $("#selBtn").textContent = selMode ? "退出选择" : "选择";
  if (!selMode){ sel.clear(); updateSel();
    document.querySelectorAll(".card").forEach(c => {
      c.classList.remove("picked");
      const b = c.querySelector(".chk"); if (b) b.checked = false;
    });
  }
});

function extOf(blob, buf){
  const b = new Uint8Array(buf.slice(0, 12));
  const t = (blob.type || "").toLowerCase();
  if (t.includes("png")  || (b[0] === 0x89 && b[1] === 0x50)) return "png";
  if (t.includes("gif")  || (b[0] === 0x47 && b[1] === 0x49)) return "gif";
  if (t.includes("webp") || (b[0] === 0x52 && b[1] === 0x49)) return "webp";
  if (t.includes("bmp")  || (b[0] === 0x42 && b[1] === 0x4d)) return "bmp";
  return "jpg";  // CDN 多数情况返回 application/octet-stream，靠文件头判断
}

$("#dlBtn").addEventListener("click", async () => {
  const list = [...sel];
  if (!list.length) return;
  const btn = $("#dlBtn");
  btn.disabled = true;
  let done = 0, fail = 0;
  for (let i = 0; i < list.length; i++){
    btn.textContent = "下载中 " + (i + 1) + "/" + list.length;
    try{
      const r = await fetch(CDN + list[i]);
      if (!r.ok) throw new Error(r.status);
      const blob = await r.blob();
      const ext = extOf(blob, await blob.slice(0, 12).arrayBuffer());
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "steam_" + String(PICS.indexOf(list[i]) + 1).padStart(3, "0") + "." + ext;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      done++;
    } catch(e){ fail++; }
    await new Promise(r => setTimeout(r, 300));
  }
  btn.textContent = "下载所选（" + sel.size + "）";
  btn.disabled = sel.size === 0;
  toast("完成 " + done + " 张" + (fail ? "，失败 " + fail + " 张" : ""));
});

function openLb(i){ lbIdx = i; syncLb(); $("#lb").classList.add("on"); }
function syncLb(){
  const p = view[lbIdx];
  if (!p) return;
  $("#lbImg").src = CDN + p;
  $("#lbInfo").textContent = "#" + (lbIdx + 1) + " / " + view.length;
  $("#lbOpen").href = CDN + p;
}
function closeLb(){ $("#lb").classList.remove("on"); lbIdx = -1; $("#lbImg").src = ""; }
function step(d){ lbIdx = (lbIdx + d + view.length) % view.length; syncLb(); }

$("#lbClose").addEventListener("click", closeLb);
$("#lbPrev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
$("#lbNext").addEventListener("click", e => { e.stopPropagation(); step(1); });
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") closeLb(); });
$("#lbCopy").addEventListener("click", () => {
  const url = CDN + view[lbIdx];
  navigator.clipboard.writeText(url)
    .then(() => toast("已复制直链"))
    .catch(() => { window.prompt("复制这个地址：", url); });
});

document.addEventListener("keydown", e => {
  if (lbIdx < 0) return;
  if (e.key === "Escape") closeLb();
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});

$("#q").addEventListener("input", apply);

load();
</script>
</body>
</html>
